name: Build BatikCode Server (REH)

# Publishes the remote extension host that Remote-SSH installs on a server.
#
# Without it, `remote.SSH.serverDownloadUrlTemplate` has nothing of ours to
# point at and the client falls back to a foreign build — which connects, but
# brings that project's built-in extensions instead of BatikCode's.
#
# Runs here rather than on a developer machine because the build holds the whole
# compile in one Node heap and needs more memory than a laptop can spare while
# also running the IDE.

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create the release as a draft
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One target failing should not discard the others — a partial release is
      # still useful, and the missing arch can be re-run on its own.
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm

    env:
      NPM_ARCH: ${{ matrix.arch }}
      VSCODE_ARCH: ${{ matrix.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Free disk space
        run: |
          # node_modules plus the build output do not fit alongside the runner's
          # preinstalled toolchains.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install build dependencies
        run: |
          set -e
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get update
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get install -y \
            pkg-config \
            libxkbfile-dev \
            libkrb5-dev

      - name: Install build tooling
        working-directory: build
        run: |
          set -e
          for i in {1..5}; do
            npm ci && break
            if [ $i -eq 5 ]; then echo "npm ci failed too many times" >&2; exit 1; fi
            echo "npm ci failed ($i), retrying..."
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          set -e
          source ./build/azure-pipelines/linux/setup-env.sh
          for i in {1..5}; do
            npm ci && break
            if [ $i -eq 5 ]; then echo "npm ci failed too many times" >&2; exit 1; fi
            echo "npm ci failed ($i), retrying..."
          done
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}
          VSCODE_ARCH: ${{ env.VSCODE_ARCH }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build server
        run: |
          set -e
          mkdir -p .build
          npm run gulp vscode-reh-${{ matrix.platform }}-${{ matrix.arch }}

      - name: Package server
        id: package
        run: |
          set -e
          version=$(node -p "require('./package.json').version")
          out="../vscode-reh-${{ matrix.platform }}-${{ matrix.arch }}"
          if [ ! -d "$out" ]; then
            echo "Build produced no $out directory" >&2
            exit 1
          fi
          # Must match product.json's serverDownloadUrlTemplate exactly, and the
          # server-setup script extracts with --strip-components 1, so the
          # archive must contain exactly one top-level directory.
          name="batikcode-server-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"
          tar -czf "$name" -C "$(dirname "$out")" "$(basename "$out")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "asset=${name}" >> "$GITHUB_OUTPUT"
          ls -lh "$name"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: batikcode-server-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ steps.package.outputs.asset }}
          retention-days: 14

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          # A manual run publishes under the current package version; a tag push
          # publishes under that tag.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.package.outputs.version) }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          files: ${{ steps.package.outputs.asset }}
          fail_on_unmatched_files: true
